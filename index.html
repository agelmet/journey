<!DOCTYPE html>
<html lang="el" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Angelo — Journey / Το Ταξίδι</title>
<meta name="description" content="2020 → 2026. A-Levels, affiliate, six stores, day trading, and Advon Media — the full interactive map, in Greek and English.">
<meta name="theme-color" content="#f2f4fc">
<meta property="og:title" content="Angelo — The Journey Map">
<meta property="og:description" content="From A-Levels and mindset books to 200+ websites. Every venture, win and failure on one zoomable map.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2312a86a' stroke-width='2' stroke-linecap='round'><path d='M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z'/><circle cx='12' cy='10' r='2.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg__grid"></div>
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>
</div>

<header class="header">
  <div class="brand"><span class="brand__dot"></span>ANGELO <span class="brand__role" id="brand-role"></span></div>
  <div class="hstats" id="hdrStats"></div>
  <div class="header__spacer"></div>
  <div class="hdr-progress">
    <span id="hdrLabel"></span>
    <div class="hdr-progress__track"><div class="hdr-progress__fill" id="hdrFill"></div></div>
    <span id="hdrPct">0%</span>
  </div>
  <button class="pill-btn" id="aboutBtn" aria-label="About">i</button>
  <button class="pill-btn" id="themeBtn" aria-label="Theme"></button>
  <div class="lang" data-active="el">
    <span class="lang__thumb"></span>
    <button data-lang="el" aria-pressed="true">ΕΛ</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<section class="board" id="board">
  <div class="board__canvas" id="canvas">
    <svg class="board__svg" id="roadSvg" aria-hidden="true">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%"   stop-color="#6d5ce0"/>
          <stop offset="22%"  stop-color="#9b59ff"/>
          <stop offset="42%"  stop-color="#0aa8d6"/>
          <stop offset="62%"  stop-color="#e8407a"/>
          <stop offset="80%"  stop-color="#f08a1e"/>
          <stop offset="100%" stop-color="#12a86a"/>
        </linearGradient>
      </defs>
      <path class="road-base" id="roadBase"></path>
      <path class="road-glow" id="roadGlow"></path>
      <path class="road-fill" id="roadFill"></path>
    </svg>
    <div id="bands"></div>
    <div id="nodes"></div>
  </div>

  <div class="ov hint glass" id="hint"></div>
  <div class="ov updated glass" id="updated"></div>
  <div class="ov zoomctl glass">
    <button id="zOut" aria-label="Zoom out">−</button>
    <span id="zVal">100%</span>
    <button id="zIn" aria-label="Zoom in">+</button>
    <button id="zReset" aria-label="Reset view">⤢</button>
    <button id="tour" aria-label="Tour">▶</button>
  </div>
</section>

<aside class="panel" id="panel" role="dialog" aria-modal="false">
  <div class="panel__bar">
    <button class="pill-btn" id="pPrev" aria-label="Previous">‹</button>
    <button class="pill-btn" id="pNext" aria-label="Next">›</button>
    <span class="panel__count" id="pCount"></span>
    <button class="pill-btn" id="pClose" aria-label="Close">✕</button>
  </div>
  <div class="panel__body" id="panelBody"></div>
</aside>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox__x" id="lbClose" aria-label="Close">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">‹</button>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">›</button>
  <div><img id="lbImg" alt=""><p class="lightbox__cap" id="lbCap"></p></div>
</div>

<script src="data/journey.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
